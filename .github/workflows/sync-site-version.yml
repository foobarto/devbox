name: Sync website version

on:
  schedule:
    # Monday, 05:17 UTC. Avoid the busiest start-of-hour schedule window.
    - cron: "17 5 * * 1"
  workflow_dispatch:

# The workflow creates a protected-branch-compliant version-sync PR, squash
# merges it, then explicitly requests a Pages build. GITHUB_TOKEN merges do
# not trigger a GitHub Pages build.
permissions:
  contents: write
  pages: write
  pull-requests: write

concurrency:
  group: sync-site-version
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main

      - name: Read the canonical Devbox version
        id: version
        run: |
          version="v$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            printf 'VERSION is not a supported semantic version: %s\n' "$version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Update the website version marker
        id: update
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 scripts/update-site-version.py "$VERSION"
          if git diff --quiet -- docs/index.html; then
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'changed=true\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Create and merge the version-sync pull request
        if: steps.update.outputs.changed == 'true'
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          nonce="$(python3 -c 'import secrets; print(secrets.token_hex(8))')"
          branch="automation/sync-site-version-${VERSION}-${GITHUB_RUN_ID}-${nonce}"

          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "docs(site): sync version to ${VERSION}"
          expected_head="$(git rev-parse HEAD)"
          git push --set-upstream origin "$branch"
          pr_url="$(gh pr create --base main --head "$branch" --title "docs(site): sync version to ${VERSION}" --body "Automated website version update from \`VERSION\`.")"
          pr_number="${pr_url##*/}"
          abandon() {
            printf '::error::%s\n' "$1"
            gh pr close "$pr_url" --delete-branch --comment "Closed by automation: $1" || true
            exit 1
          }
          pr_state="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq '[.head.repo.full_name, .head.ref, .head.sha, .base.ref] | @tsv')"
          [[ "$pr_state" == "${GITHUB_REPOSITORY}"$'\t'"${branch}"$'\t'"${expected_head}"$'\t'main ]] \
            || abandon "PR head or base does not match the pushed commit (got: ${pr_state//$'\t'/ })"
          changed="$(gh pr diff "$pr_url" --name-only)"
          [[ "$changed" == docs/index.html ]] \
            || abandon "PR changes more than docs/index.html: ${changed//$'\n'/ }"
          gh pr merge "$pr_url" --squash --delete-branch --match-head-commit "$expected_head" \
            || abandon "could not merge the version-sync PR (branch protection or a moved head)"
          printf 'merged=true\n' >> "$GITHUB_OUTPUT"

      - name: Request a GitHub Pages build
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
